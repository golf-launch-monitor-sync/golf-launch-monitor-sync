openapi: 3.1.0
info:
  title: Golf Launch Monitor Sync — target API
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
  description: |
    What an app implements to receive launch monitor data from this project's clients (browser
    extension, web app, companion app). The app — the *target* — decides **when** a client fetches
    (`GET /plan`); the client fetches from the provider with the player's own sign-in, which never
    reaches the target, and sends the result in olmd/1 (`POST /import`).

    The base URL is the target's own, conventionally ending in `/lm/v1`
    (`https://app.example.org/api/lm/v1`); every path below is relative to it. All requests but
    `POST /pair` carry `Authorization: Bearer <import token>`. An import token can only write
    olmd batches and read the list of its own external ids: no shots, no rounds, no profile. Since
    1.8.0 a test account's token can also read its test scenario, with its code (spec/test-mode.md).

    See spec/target-api.md for the rules behind each endpoint.
servers:
  - url: "{base}"
    variables:
      base:
        default: https://app.example.org/lm/v1
        description: The target's base URL, as handed to the client at pairing.
security:
  - importToken: []
paths:
  /pair:
    post:
      operationId: pair
      summary: Exchange a pairing code for an import token.
      description: |
        The player gets a code in the target app (valid ten minutes, usable once) and hands it to a
        client through a deep link or the web app's pairing page (spec/deep-links.md).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PairRequest" }
      responses:
        "200":
          description: Paired.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PairResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "404":
          description: "Unknown, expired or already used code (`code_invalid`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooMany" }
  /plan:
    get:
      operationId: plan
      summary: Whether to fetch now, and what.
      description: |
        Every client asks this before it asks the provider anything. `due: false` means: don't
        fetch. A due plan holds a lease (`lease_until`) for its kind (a regular sync or a history
        chunk): another client of the same player asking meanwhile gets `busy: true` and the `holder`;
        the same client asking again takes its own lease over (1.13.0). The import with the plan's
        `plan_id` releases it. A target keeps at least the reference planning rules
        (spec/planning.md); the client's load guard holds regardless (spec/guard.md).
      parameters:
        - name: provider
          in: query
          required: true
          schema: { $ref: "#/components/schemas/Provider" }
        - name: reason
          in: query
          required: true
          schema: { $ref: "#/components/schemas/Reason" }
        - name: client
          in: query
          required: false
          description: Which kind of client asks.
          schema: { $ref: "#/components/schemas/ClientKind" }
        - $ref: "#/components/parameters/SignIn"
        - name: can
          in: query
          required: false
          description: "Since 1.20.0: what the client can do beyond earlier versions, comma-separated (`older_rounds`, `sessions_again`; target-api.md, *What a client can*). Unknown words are left out."
          schema: { type: string, maxLength: 200 }
      responses:
        "200":
          description: The plan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooMany" }
  /import:
    post:
      operationId: import
      summary: Hand over an olmd/1 batch.
      description: |
        Idempotent per (provider, account_ref, external_id): what the target has already is not
        stored twice. A round may come again with only its id and `shots` (fetched later). A batch
        of another provider account than the connected one is refused (`other_account`): switching
        accounts takes a disconnect in the target app first.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../olmd/olmd-1.schema.json" }
      responses:
        "200":
          description: Stored (as far as it was new).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`test_data` (1.8.0): a batch marked `test` for an account that is no test account (spec/test-mode.md). Don't send it again."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`other_account`: the batch comes from another provider account than the connected one; `disconnected`: the player ended the connection."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: "`too_large`: more than the limits handed out at pairing. Split and send again."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooMany" }
  /known:
    get:
      operationId: known
      summary: The external ids the target already has, so they aren't fetched again.
      parameters:
        - name: provider
          in: query
          required: true
          schema: { $ref: "#/components/schemas/Provider" }
        - name: since
          in: query
          required: false
          description: Only what was played on or after this time (and what has no time).
          schema: { $ref: "#/components/schemas/Time" }
      responses:
        "200":
          description: The ids.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [external_ids]
                properties:
                  external_ids:
                    type: array
                    items: { type: string, minLength: 1, maxLength: 400 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooMany" }
  /status:
    get:
      operationId: status
      summary: The connection as the client shows it ("connected with …").
      description: |
        Also how a client that won't ask for a plan (it has no sign-in it can fetch with) still tells
        the target where its sign-in stands (`signin`, since 1.5.0), without taking a lease.
      parameters:
        - $ref: "#/components/parameters/SignIn"
      responses:
        "200":
          description: The status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /test-scenario:
    get:
      operationId: testScenario
      summary: "Optional, since 1.8.0: the test scenario of a test account, made-up answers of a provider."
      description: |
        Only for a target that offers test scenarios, and only for the import token of a test account: a
        client plays the scenario back to its real provider code instead of asking the provider
        (spec/test-mode.md). The test code travels in the header `X-Test-Code`, never in the address. A
        target that offers none answers 404 (`test_unavailable`, or its own 404 when it doesn't know the
        path at all).
      parameters:
        - name: X-Test-Code
          in: header
          required: true
          description: The test code the target app showed for this test account (spec/test-mode.md).
          schema: { type: string, pattern: "^[0-9A-Za-z-]{6,64}$" }
      responses:
        "200":
          description: The scenario. The same every time for the same code.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestScenario" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`not_test_account`: the token's account is no test account (the token stays good for everything else)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "`code_invalid`: no scenario for this code and account; `test_unavailable`: the target offers no test scenarios. Any other 404 reads as `test_unavailable`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "410":
          description: "`code_expired`: the code was good once, but its test is over."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooMany" }
  /token:
    delete:
      operationId: revokeToken
      summary: The client disconnects itself; the token stops working.
      responses:
        "204": { description: Revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /wake:
    put:
      operationId: registerWake
      summary: "Since 1.9.0, optional: the push address the target may wake this client at when a plan is due (spec/wake.md)."
      description: |
        Kept per import token: revoking the token ends it. Registering again replaces the address. A target that
        offers no wake answers 404, and the client leaves it be for a while.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WakeRegistration" }
      responses:
        "204": { description: Kept. }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: This target offers no wake. }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooMany" }
    delete:
      operationId: forgetWake
      summary: "Since 1.9.0: no more wakes for this client (also when there was none)."
      responses:
        "204": { description: Forgotten. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: This target offers no wake. }
components:
  securitySchemes:
    importToken:
      type: http
      scheme: bearer
      description: The import token from `POST /pair`. Stored by the target only as a hash; revocable in the target app.
  parameters:
    SignIn:
      name: signin
      in: query
      required: false
      description: |
        Since 1.5.0: where the client's provider sign-in stands right now, so the target app can show the
        player the next step on this device (spec/target-api.md, *The client's sign-in*). Informative only:
        it changes no plan. A target reads it strictly (exactly once, one of the values) and ignores anything
        else; a client older than 1.5.0 sends none.
      schema: { $ref: "#/components/schemas/SignIn" }
  responses:
    Error:
      description: A request the target can't take.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: "`token_invalid`: no token, an unknown one, or one the player revoked. Pair again."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooMany:
      description: Too many requests; wait at least `Retry-After` seconds.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Provider:
      type: string
      pattern: "^[a-z][a-z0-9_-]{1,39}$"
      examples: [trackman, demo]
    Reason:
      type: string
      enum: [connect, open, timer, manual, backfill]
      description: |
        connect: the player just paired or signed in to the provider again; open: the target app
        was opened or came back to the front; timer: the client's regular look; manual: the player
        asked for it; backfill: the older history, a chunk at a time.
    ClientKind:
      type: string
      enum: [extension, web, companion, cli, other]
    SignIn:
      type: string
      enum: [none, confirm, ready, expired, other]
      description: |
        none: not signed in to the provider on this device yet; confirm: signed in, but the player hasn't
        answered "Is this your account?" yet; ready: signed in and confirmed, it can fetch; expired: the
        sign-in ran out or the provider refused it; other: signed in with another provider account than the
        one the target has connected.
    Time:
      type: string
      format: date-time
      pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]{1,9})?(Z|[+-][0-9]{2}:[0-9]{2})$"
    PairRequest:
      type: object
      additionalProperties: false
      required: [code, provider, client]
      properties:
        code: { type: string, pattern: "^[0-9A-Za-z-]{6,64}$" }
        provider: { $ref: "#/components/schemas/Provider" }
        client:
          type: object
          additionalProperties: false
          required: [kind, name]
          properties:
            kind: { $ref: "#/components/schemas/ClientKind" }
            name: { type: string, minLength: 1, maxLength: 100, description: "e.g. 'Golf Launch Monitor Sync for Chrome'" }
            version: { type: string, maxLength: 50 }
    PairResponse:
      type: object
      additionalProperties: false
      required: [token, target, account_salt, limits]
      properties:
        token: { type: string, minLength: 32, maxLength: 256, description: "Shown once; the target keeps only its hash." }
        target:
          type: object
          additionalProperties: false
          required: [name]
          properties:
            name: { type: string, minLength: 1, maxLength: 100, description: "The app's name, shown in the client." }
            return_prefixes:
              type: array
              maxItems: 10
              description: "Where `glmsync://sync?return=` (and, since 1.2.0, a pair link's `return`) may jump back to (spec/deep-links.md). Each ends with '/' or '://'."
              items: { type: string, minLength: 4, maxLength: 200 }
        account_salt:
          type: string
          minLength: 16
          maxLength: 128
          description: |
            The salt of `account_ref` (spec/olmd.md). Fixed per player and target, so every client
            of the player computes the same `account_ref` for the same provider account.
        account_ref:
          type: string
          pattern: "^[A-Za-z0-9_-]{16,128}$"
          description: "The provider account already connected, if any: a client refuses another one before it asks the provider for anything."
        limits: { $ref: "#/components/schemas/ImportLimits" }
    ImportLimits:
      type: object
      additionalProperties: false
      required: [max_bytes, max_sessions, max_shots, max_rounds, max_round_shots]
      properties:
        max_bytes: { type: integer, minimum: 1 }
        max_sessions: { type: integer, minimum: 1, description: Sessions per batch. }
        max_shots: { type: integer, minimum: 1, description: Shots of all sessions per batch. }
        max_rounds: { type: integer, minimum: 1 }
        max_round_shots: { type: integer, minimum: 1, description: Shots of all rounds per batch. }
    RoundWanted:
      type: object
      additionalProperties: false
      required: [external_id]
      properties:
        external_id: { type: string, minLength: 1, maxLength: 400 }
        played_at: { $ref: "#/components/schemas/Time" }
        newer:
          type: integer
          minimum: 0
          description: About where it stands in the provider's list (newest first) — the number of known rounds played after it — so the client starts paging there.
    SessionWanted:
      type: object
      additionalProperties: false
      required: [external_id]
      properties:
        external_id: { type: string, minLength: 1, maxLength: 400 }
        started_at: { $ref: "#/components/schemas/Time" }
    Plan:
      type: object
      additionalProperties: false
      required: [due]
      properties:
        due: { type: boolean }
        busy: { type: boolean, description: Another client of the player holds the lease of this kind; ask again later. }
        holder:
          type: object
          additionalProperties: false
          required: [kind]
          description: "With `busy` (since 1.13.0): the client holding the lease, so a client can say who is fetching. Never the asking client itself: that one takes its own lease over."
          properties:
            kind: { $ref: "#/components/schemas/ClientKind" }
            since: { $ref: "#/components/schemas/Time" }
        wait_s: { type: number, minimum: 0, description: "For `backfill`: seconds until the next history chunk may go." }
        disconnected: { type: boolean, description: The player ended the connection in the target app; drop the provider sign-in and stop. }
        account_ref: { type: string, pattern: "^[A-Za-z0-9_-]{16,128}$", description: The provider account connected here. }
        plan_id: { type: string, minLength: 1, maxLength: 200, description: "Echoed in the batch's `sync.plan_id`; its import releases the lease." }
        lease_until: { $ref: "#/components/schemas/Time" }
        since: { $ref: "#/components/schemas/Time" }
        max_sessions: { type: integer, minimum: 0, description: "Sessions to fetch at most (0: list none)." }
        known_ids:
          type: array
          description: External ids played since `since` the target has — not to be fetched again.
          items: { type: string, minLength: 1, maxLength: 400 }
        give_up:
          type: array
          description: Ids to leave alone this time (failed too often, or waiting for a later sync).
          items: { type: string, minLength: 1, maxLength: 400 }
        rounds:
          type: boolean
          description: Whether to list the provider's rounds (scorecards) in this sync.
        round_shots:
          type: boolean
          description: Whether to fetch each shot of new rounds.
        rounds_wanted:
          type: array
          description: Known rounds whose shots the target still lacks.
          items: { $ref: "#/components/schemas/RoundWanted" }
        rounds_skip:
          type: integer
          minimum: 0
          description: "Since 1.20.0, with `rounds` in a history chunk (to a client that can `older_rounds`): how many of the newest scorecards to pass over; the client lists a few pages from there and says in `progress.rounds_end` whether the list ended (planning.md, *The whole history*)."
        sessions_wanted:
          type: array
          maxItems: 200
          description: "Since 1.20.0, in a history chunk (to a client that can `sessions_again`): known sessions the target holds without shots, to fetch once more."
          items: { $ref: "#/components/schemas/SessionWanted" }
        pace:
          type: number
          minimum: 0.5
          description: Multiplies the client's pauses between provider requests (1 = normal). Never below 0.5; the guard's minimum pause holds anyway.
        history:
          type: object
          additionalProperties: false
          properties:
            done: { type: boolean }
            from: { $ref: "#/components/schemas/Time" }
        last_import_at: { $ref: "#/components/schemas/Time" }
    ImportResult:
      type: object
      additionalProperties: false
      required: [sessions, shots, rounds, round_shots, duplicates]
      properties:
        sessions: { type: integer, minimum: 0, description: New sessions stored. }
        shots: { type: integer, minimum: 0 }
        rounds: { type: integer, minimum: 0 }
        round_shots: { type: integer, minimum: 0, description: Rounds whose shots were stored. }
        duplicates: { type: integer, minimum: 0, description: What the target had already. }
        not_stored:
          type: array
          description: Sessions the target could not store this time; the next plan asks for them again.
          items: { type: string, minLength: 1, maxLength: 400 }
    Status:
      type: object
      additionalProperties: false
      required: [target, connected]
      properties:
        target:
          type: object
          additionalProperties: false
          required: [name]
          properties:
            name: { type: string, minLength: 1, maxLength: 100 }
        connected: { type: boolean }
        provider: { $ref: "#/components/schemas/Provider" }
        account_ref: { type: string, pattern: "^[A-Za-z0-9_-]{16,128}$" }
        last_import_at: { $ref: "#/components/schemas/Time" }
        token:
          type: object
          additionalProperties: false
          properties:
            created_at: { $ref: "#/components/schemas/Time" }
            last_used_at: { $ref: "#/components/schemas/Time" }
    Latency:
      type: object
      required: [median_s, spread_s]
      description: How long the provider takes to answer, in seconds. A client waits about the median, give or take the spread.
      properties:
        median_s: { type: number, minimum: 0, maximum: 60 }
        spread_s: { type: number, minimum: 0, maximum: 60 }
    TestScenario:
      type: object
      required: [name, provider, subject, profile, data, valid_until]
      description: |
        Since 1.8.0 (spec/test-mode.md): made-up answers of a provider, in the provider's own shapes, which a
        client plays back to its real provider code. Synthetic, always. A client reads it strictly
        (spec/reference/testmode.py, vectors in spec/testvectors/test-scenario.json) and ignores keys it
        doesn't know; at most 64 MiB.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: The scenario's name, shown beside the client's test mode badge. No control characters.
        provider: { $ref: "#/components/schemas/Provider" }
        subject:
          type: string
          pattern: "^[\\x21-\\x7e]{1,200}$"
          description: |
            The made-up provider account's stable id: what the client's `account_ref` and its load guard count
            under. A target gives every code a subject of its own, so every test starts with a fresh guard.
        profile:
          type: object
          description: The provider's answer about whose account it is (for Trackman the `profile` of `me`), in its own shape.
        data:
          type: object
          description: |
            The provider's answers, in its own shape. For `trackman`: `activities` (newest first), `nodes` (each
            session's node by activity id), `scorecards` (newest first) and `shotHoles` (a scorecard's holes with
            their shots, by scorecard id), as packages/provider-trackman's test double answers them.
        latency:
          type: object
          description: Response times; a bad entry is dropped, a missing one is the client's own default.
          properties:
            default: { $ref: "#/components/schemas/Latency" }
            queries:
              type: object
              maxProperties: 50
              description: By the provider's own name of the query (for Trackman Activities, Session, Rounds, RoundShots, Who, Profile).
              propertyNames: { pattern: "^[A-Za-z][A-Za-z0-9_.-]{0,63}$" }
              additionalProperties: { $ref: "#/components/schemas/Latency" }
        valid_until:
          allOf: [{ $ref: "#/components/schemas/Time" }]
          description: When the test is over; the client drops the scenario then (and at its sign-out).
    WakeRegistration:
      type: object
      required: [service, address]
      description: "Unknown keys are ignored. A wake's push carries only {\"kind\": \"lm_plan\"} (spec/wake.md)."
      properties:
        service: { type: string, enum: [expo], description: "expo: an Expo push token of the client app's own project." }
        address:
          type: string
          maxLength: 256
          pattern: "^(?:ExponentPushToken|ExpoPushToken)\\[[A-Za-z0-9_-]{8,200}\\]$"
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code]
          properties:
            code:
              type: string
              enum: [bad_request, code_invalid, token_invalid, other_account, disconnected, too_large, invalid_batch, rate_limited, provider_unknown, test_data, test_unavailable, not_test_account, code_expired]
            message: { type: string, maxLength: 500 }
