# Every push to main and every pull request: types, tests, whether the vectors are what the
# reference writes, and the click checks of the extension and the web app (with the store packages
# built on the way); whether the extension's version is new, or should be (a hint, no failure). No
# secrets. Published from here, each with the workflow's own token once all of the above is green: a push to
# main that raises the extension's version (release.yml), and one that raises the engine's (engine-release.yml).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  # The companion app as Metro bundles it for the phones (Android and iOS, Hermes bytecode): an import
  # that resolves for the tests but not for the app shows here. No build, no secret.
  companion-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @glmsync/companion bundle:check

  vectors:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The runner's own Python 3; the reference needs the standard library only.
      - run: python3 --version && python3 spec/reference/generate.py --check

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The full Chromium: the headless shell loads no extensions.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter @glmsync/extension package
      - run: pnpm e2e
      # The store packages of main, for testers before a release (unsigned; load unpacked).
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: extension-packages
          path: apps/extension/dist/*.zip
          retention-days: 30
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7

  # Whether this commit's extension version is a new release - or should be one: a hint in the run when what
  # goes into the extension changed since its last release without a new version (tools/release-check.mjs).
  extension-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The tags and the history since the last release.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - id: check
        run: node tools/release-check.mjs

  # A new extension version on main goes out by itself, after every check above is green on this very commit.
  release-extension:
    needs: [test, companion-bundle, vectors, e2e, extension-version]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      github.repository == 'golf-launch-monitor-sync/golf-launch-monitor-sync' &&
      needs.extension-version.outputs.release == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      checked: true

  # Whether this commit's engine version (packages/engine/package.json) is released yet: a new one goes out by itself.
  engine-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./packages/engine/package.json').version")
          if gh release view "engine-v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Engine $version: released."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Engine version::Engine $version is not released yet: it is released once all checks of this commit are green."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  # A new engine version on main goes out by itself, after every check above is green on this very commit.
  release-engine:
    needs: [test, companion-bundle, vectors, e2e, engine-version]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      github.repository == 'golf-launch-monitor-sync/golf-launch-monitor-sync' &&
      needs.engine-version.outputs.release == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/engine-release.yml
    with:
      checked: true
