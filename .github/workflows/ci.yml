# Every push to main and every pull request: types, tests, whether the vectors are what the
# reference writes, and the click checks of the extension and the web app (with the store packages
# built on the way). Read-only; no secrets; nothing is published from here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  # The companion app as Metro bundles it for the phones (Android and iOS, Hermes bytecode): an import
  # that resolves for the tests but not for the app shows here. No build, no secret.
  companion-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @glmsync/companion bundle:check

  vectors:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The runner's own Python 3; the reference needs the standard library only.
      - run: python3 --version && python3 spec/reference/generate.py --check

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The full Chromium: the headless shell loads no extensions.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter @glmsync/extension package
      - run: pnpm e2e
      # The store packages of main, for testers before a release (unsigned; load unpacked).
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@v5
        with:
          name: extension-packages
          path: apps/extension/dist/*.zip
          retention-days: 30
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7
