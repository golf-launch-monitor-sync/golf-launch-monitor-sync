# The browser extension's store packages, on a tag `extension-v<version>` (the version in
# apps/extension/package.json), by hand on main (Actions › Release extension › Run workflow), or - since
# 18 Nov - by itself: CI calls it on a push to main whose extension version isn't released yet, once all
# of CI's checks of that commit are green (ci.yml, tools/release-check.mjs). By hand and by itself it makes
# the tag: tests and click checks (unless CI just ran them), Mozilla's linter, then a GitHub release with
# one zip for Chrome and Edge and one for Firefox. Submitting them to the stores is done by hand; no store
# credentials are kept here.
name: Release extension

on:
  push:
    tags: ['extension-v*']
  workflow_dispatch:
  workflow_call:
    inputs:
      checked:
        description: CI has just run the tests and the click checks on this very commit.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The tag names the package's version
        id: tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF: ${{ github.ref_name }}
          AUTO: ${{ inputs.checked == true }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./apps/extension/package.json').version")
          if [ "$REF_TYPE" = tag ]; then
            test "$REF" = "extension-v$version" || { echo "Tag $REF, but apps/extension/package.json says $version"; exit 1; }
            echo "tag=$REF" >> "$GITHUB_OUTPUT"
          elif gh release view "extension-v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # By itself: released meanwhile (a run of an earlier push got there first) - nothing to do.
            if [ "$AUTO" = true ]; then echo "extension-v$version is released already." | tee -a "$GITHUB_STEP_SUMMARY"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; fi
            # By hand: this version must not be released yet (raise it in package.json first).
            echo "extension-v$version is released already: raise the version in apps/extension/package.json."; exit 1
          else
            echo "tag=extension-v$version" >> "$GITHUB_OUTPUT"
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"
      - if: steps.tag.outputs.go == 'true' && !inputs.checked
        run: pnpm typecheck
      - if: steps.tag.outputs.go == 'true' && !inputs.checked
        run: pnpm test
      - if: steps.tag.outputs.go == 'true' && !inputs.checked
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.tag.outputs.go == 'true'
        run: pnpm --filter @glmsync/extension package
      - if: steps.tag.outputs.go == 'true' && !inputs.checked
        run: pnpm e2e
      # Self-hosted: signed by Mozilla but not listed, it names its own update_url (src/manifest.ts).
      - name: Mozilla's linter on the Firefox build
        if: steps.tag.outputs.go == 'true'
        run: npx --yes web-ext@8 lint --source-dir apps/extension/dist/firefox --warnings-as-errors --self-hosted
      - name: GitHub release
        if: steps.tag.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # By hand the tag doesn't exist yet: the release makes it, at this commit.
          gh release create "$TAG" apps/extension/dist/*.zip --target "$GITHUB_SHA" \
            --repo "$GITHUB_REPOSITORY" --title "Browser extension ${TAG#extension-v}" \
            --notes "Packages for the Chrome Web Store (also Edge Add-ons) and Firefox Add-ons. Unsigned: install from the stores, or load unpacked for testing (apps/extension/README.md). The Firefox package signed by Mozilla is attached here as an .xpi once it is; Firefox then updates from the web app's site."
