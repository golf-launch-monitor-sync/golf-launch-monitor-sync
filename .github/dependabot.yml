version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev:
        dependency-type: development
    ignore:
      # The types follow the Node version the project runs on (.nvmrc), not the newest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # The companion app's native packages move together with the Expo SDK, on purpose and all at once
      # (apps/companion/README.md), never one by one.
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "react"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native-async-storage/*"
      - dependency-name: "@types/react"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
